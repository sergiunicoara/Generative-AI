# CI for ai-knowledge-graph-platform.
#
# This file must live at the REPOSITORY root (.github/workflows/), not inside
# the project directory. GitHub Actions only reads workflows from the root, so
# the previous copy at ai-knowledge-graph-platform/.github/workflows/ci.yml was
# never executed — not once. Path filters keep it from running on unrelated
# changes elsewhere in the monorepo.

name: ai-knowledge-graph-platform CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "ai-knowledge-graph-platform/**"
      - ".github/workflows/ai-knowledge-graph-platform-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ai-knowledge-graph-platform/**"
      - ".github/workflows/ai-knowledge-graph-platform-ci.yml"
  # Nightly, unattended run — catches a regression introduced by dependency
  # drift or environment change even when nobody touched this project that
  # day. 03:00 UTC, no path filter (schedule triggers always run full repo).
  schedule:
    - cron: "0 3 * * *"

defaults:
  run:
    working-directory: ai-knowledge-graph-platform

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # ENV is required, not defaulted (graphrag/core/config.py fails closed on
    # unset ENV — no .env file exists in CI, it's gitignored). "test" is in
    # DEV_ENVS so this runs against the same relaxed secret checks local dev
    # gets, not production-strict validation.
    env:
      ENV: test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-knowledge-graph-platform/requirements*.txt

      # requirements-dev.txt pulls in requirements.txt and adds pytest,
      # pytest-asyncio and ruff — none of which were declared anywhere before,
      # so this step used to leave `pytest` uninstalled. CPU torch first, as in
      # the E2E job: CUDA wheels fill the runner disk.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify generated semantic-model artifacts
        run: python -m graphrag.semantic_model compile ontology/models/energy-asset-intelligence.yaml --check --fail-on-error

      - name: Verify competency questions still match their domain ontologies
        run: python scripts/check_competency_questions.py

      - name: Verify the deliverable from a clean Git snapshot
        run: python scripts/verify_energy_clean_snapshot.py

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short --junitxml=reports/junit-unit.xml

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short --junitxml=reports/junit-integration.xml

      - name: Run load tests
        run: python -m pytest tests/load/ -v --tb=short --junitxml=reports/junit-load.xml

      # JUnit results include the graph-validation suite (tests/unit/test_publication_gate.py).
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: ai-knowledge-graph-platform/reports/junit-*.xml
          if-no-files-found: ignore

      - name: Validate evaluation datasets
        run: python scripts/validate_eval_datasets.py

  e2e:
    name: E2E (live Neo4j + Redis via testcontainers)
    runs-on: ubuntu-latest
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-knowledge-graph-platform/requirements*.txt
      # CPU wheels first: the default Linux torch pulls several GB of CUDA
      # packages, and with the testcontainers images that filled the runner
      # disk ("No space left on device"). No test here uses a GPU.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # tests/e2e is the only tier that exercises real Cypher against a real
      # database; the other three are AsyncMock throughout. It was absent from
      # CI entirely, and it self-skips silently when Docker is unavailable — so
      # a green run proved nothing. `-p no:randomly` keeps container fixtures in
      # order; `-ra` surfaces skip reasons; the grep turns a silent skip into a
      # hard failure, because "skipped" here means zero real coverage ran.
      - name: Run E2E tests
        run: |
          set -o pipefail
          python -m pytest tests/e2e/ -v --tb=short -ra -p no:randomly | tee e2e.log
          if grep -qE '[0-9]+ skipped' e2e.log; then
            echo "::error::E2E tests skipped — Docker or testcontainers unavailable on the runner."
            exit 1
          fi

  clean-install:
    name: Validate a clean installation
    # Item 6 of a follow-up platform review: "validate a clean
    # installation." Every other job here installs requirements-dev.txt
    # (pytest/ruff/mypy extras) -- proving the DEV dependency set works,
    # which nobody deploying this app ever installs. This job installs
    # ONLY requirements.txt (the real production set) with no pip cache
    # (a genuinely cold install, not a warm one) and imports the real ASGI
    # app object with nothing else present, catching a prod/dev dependency
    # split the other jobs structurally cannot.
    runs-on: ubuntu-latest
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production dependencies only
        run: pip install -r requirements.txt
      - name: Import the real ASGI app with only production dependencies installed
        run: python -c "import api.main; print('OK:', api.main.app.title)"

  service-images:
    name: Service image deps (${{ matrix.service }})
    # The Dockerfile (and so every Fly/k8s/compose image) installs
    # requirements/${SERVICE}.txt, NOT the monolithic requirements.txt that
    # clean-install and every other job here install -- so a package declared
    # only in the monolith passed all of CI and still shipped a broken image.
    # That is exactly how the API image, the dashboard image and every
    # worker's paid-LLM-call path were broken while CI stayed green
    # (docs/archive/audits/audit-2026-10-01.md). This installs ONLY one
    # service's subset and imports what that container actually starts.
    runs-on: ubuntu-latest
    env:
      ENV: test
    strategy:
      fail-fast: false
      matrix:
        service: [api, dashboard, ingestion, query, evaluation, workers, backup]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only this service's requirements subset
        run: pip install -r requirements/${{ matrix.service }}.txt
      - name: Import this service's entry points and run a paid LLM-call span
        run: python scripts/verify_service_imports.py ${{ matrix.service }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Ruff check
        run: ruff check .

  infrastructure:
    name: Validate deployment definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/setup-kubectl@v4
      - name: Validate Terraform
        working-directory: ai-knowledge-graph-platform/infra/terraform
        run: |
          terraform init -backend=false
          terraform fmt -check -recursive
          terraform validate -no-color
          terraform test -no-color
      - name: Terraform security scan
        run: |
          python -m pip install --disable-pip-version-check checkov
          checkov -d ai-knowledge-graph-platform/infra/terraform --framework terraform --quiet
      - name: Render Kubernetes manifests
        run: |
          mkdir -p "$RUNNER_TEMP/k8s"
          kubectl kustomize deploy/kubernetes > "$RUNNER_TEMP/k8s/base.yaml"
          kubectl kustomize deploy/kind-smoke > "$RUNNER_TEMP/k8s/kind-smoke.yaml"
      - name: Install kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
      - name: Validate Kubernetes manifests against the API schemas
        run: |
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.30.0 \
            "$RUNNER_TEMP/k8s/base.yaml" "$RUNNER_TEMP/k8s/kind-smoke.yaml"
          # The check must be able to fail: a known-invalid manifest has to be rejected.
          if "$RUNNER_TEMP/kubeconform" -strict -kubernetes-version 1.30.0 deploy/ci/invalid-manifest.yaml; then
            echo "::error::kubeconform accepted deploy/ci/invalid-manifest.yaml"
            exit 1
          fi

  kind-smoke:
    name: Kind smoke deploy (API pod)
    # Approved 2026-11-04 although it adds CI minutes. Neo4j, Redis, RabbitMQ
    # and LLM providers are not deployed: the pod must start with a
    # non-development configuration and serve /health (see deploy/kind-smoke).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: graphrag-smoke
      - name: Build and load the API image
        run: |
          docker build --build-arg SERVICE=api -t graphrag-api:smoke .
          kind load docker-image graphrag-api:smoke --name graphrag-smoke
      - name: Create namespace and placeholder secrets
        run: |
          kubectl apply -f deploy/kubernetes/namespace.yaml
          kubectl -n graphrag create secret generic graphrag-secrets \
            --from-literal=NEO4J_URI=bolt://neo4j.graphrag.svc.cluster.local:7687 \
            --from-literal=NEO4J_USER=neo4j \
            --from-literal=NEO4J_PASSWORD="smoke-$(openssl rand -hex 16)" \
            --from-literal=RABBITMQ_URL=amqp://smoke:smoke@rabbitmq.graphrag.svc.cluster.local:5672/ \
            --from-literal=REDIS_URL=redis://redis.graphrag.svc.cluster.local:6379/0 \
            --from-literal=TIMESCALE_DB_URL=postgresql://smoke:smoke@timescale.graphrag.svc.cluster.local:5432/kpi \
            --from-literal=ENERGY_GOVERNANCE_DB_URL=sqlite+aiosqlite:////tmp/governance.db \
            --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            --from-literal=SESSION_SECRET_KEY="$(openssl rand -hex 32)" \
            --from-literal=OPENAI_API_KEY=smoke-unused \
            --from-literal=DEEPSEEK_API_KEY=smoke-unused \
            --from-literal=GROQ_API_KEY=smoke-unused
      - name: Deploy
        run: kubectl apply -k deploy/kind-smoke
      - name: Wait for a ready API pod
        run: |
          if ! kubectl -n graphrag rollout status deployment/graphrag-api --timeout=900s; then
            kubectl -n graphrag get pods,pvc -o wide
            kubectl -n graphrag describe pods -l app.kubernetes.io/name=graphrag-api
            kubectl -n graphrag get events --sort-by=.lastTimestamp
            kubectl -n graphrag logs -l app.kubernetes.io/name=graphrag-api --tail=200 || true
            exit 1
          fi
      - name: Call /health through the Service
        run: |
          kubectl -n graphrag port-forward svc/graphrag-api 18080:80 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health; then exit 0; fi
            sleep 2
          done
          kubectl -n graphrag logs -l app.kubernetes.io/name=graphrag-api --tail=200 || true
          exit 1

  release-evidence:
    name: Release evidence report
    # Runs after test/lint so the report can (when this job is later
    # extended to download their outputs as artifacts) reflect this run's
    # own results, not stand alone -- for now it stamps commit/dependency
    # evidence unconditionally and degrades every other section
    # explicitly, per scripts/build_release_evidence_report.py's docstring.
    needs: [test, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-knowledge-graph-platform/requirements*.txt
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build release evidence report
        run: |
          python scripts/build_release_evidence_report.py \
            --output artifacts/release-evidence.json \
            --markdown artifacts/release-evidence.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            ai-knowledge-graph-platform/artifacts/release-evidence.json
            ai-knowledge-graph-platform/artifacts/release-evidence.md
