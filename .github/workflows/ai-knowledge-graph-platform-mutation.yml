# Opt-in mutation-testing campaign for the high-risk adapters listed in
# ai-knowledge-graph-platform/pyproject.toml ([tool.mutmut]). mutmut 3 does not run on native
# Windows, so this is where the score is produced. Manual trigger only: it is slow and must not
# gate pushes. The score and the surviving mutants are written to the run summary and uploaded.

name: ai-knowledge-graph-platform mutation

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-knowledge-graph-platform

jobs:
  mutation:
    name: Mutation campaign
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-knowledge-graph-platform/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt mutmut
      - name: Run mutation campaign
        run: python -m mutmut run
      - name: Report score
        if: always()
        run: |
          python -m mutmut export-cicd-stats || true
          python -m mutmut results | tee mutation-results.txt || true
          {
            echo "## Mutation campaign"
            echo '```json'
            cat mutants/mutmut-cicd-stats.json 2>/dev/null || echo '{"error": "no stats produced"}'
            echo '```'
            echo "Surviving / suspicious mutants: see the uploaded mutation-results.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: |
            ai-knowledge-graph-platform/mutation-results.txt
            ai-knowledge-graph-platform/mutants/mutmut-cicd-stats.json
