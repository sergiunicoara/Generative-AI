# CI for sales-context-graph.
#
# This file must live at the REPOSITORY root (.github/workflows/), not inside
# the project directory — GitHub Actions only reads workflows from the root,
# so the previous copy at sales-context-graph/.github/workflows/ci.yml was
# never executed, not once, across every commit that touched it. Identical
# fix to the one already applied for ai-knowledge-graph-platform-ci.yml, same
# root cause. Path filters keep this from running on unrelated changes
# elsewhere in the monorepo.
#
# docs/evaluation.md's Showpad engineering-rigor assessment (2026-08-08),
# Band 1: 468 test functions existed with nothing automated to run them --
# the single highest-leverage gap the assessment found. This workflow is
# that gap closed: every push gets lint + the offline unit suite (no live
# infra needed, matches how tests/unit is written); every PR into main also
# gets the full suite against real Neo4j/Redis via docker compose, the same
# services local development already uses (sales-context-graph/docker-compose.yml).

name: sales-context-graph CI

on:
  push:
    paths:
      - "sales-context-graph/**"
      - ".github/workflows/sales-context-graph-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sales-context-graph/**"
      - ".github/workflows/sales-context-graph-ci.yml"

defaults:
  run:
    working-directory: sales-context-graph

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements.lock.txt first, exactly what the Dockerfile installs --
      # then the dev extras (pytest/ruff/mypy/...) constrained against that
      # same lock so they can't silently pull a newer fastapi/starlette/
      # pydantic than what this repo's tests actually run against. A bare
      # `pip install -e ".[dev]"` here previously resolved
      # fastapi==0.141.1/starlette==1.6.0 -- current-on-PyPI, but versions
      # this repo's tests have never been run against (see
      # requirements.lock.txt's own header, which hit and documented the
      # identical failure mode) -- and that drift is what silently broke
      # tests/unit/nlq/test_intent_catalog.py's route-discovery guard.
      - name: Install dependencies
        run: |
          pip install -r requirements.lock.txt
          pip install -e ".[dev]" -c requirements.lock.txt
      - name: ruff check
        run: ruff check src api tests scripts
      - name: mypy
        run: mypy
      # ruff format --check is deliberately NOT a gate here: verified
      # before adding this workflow that the existing codebase (hand-
      # formatted, not run through ruff's formatter) fails it on 158/238
      # files. Making that a CI gate on day one would ship it red and
      # immediately need bypassing -- worse than no gate at all. Add it
      # once a deliberate `ruff format` pass across the repo has landed as
      # its own reviewed change, not as a side effect of adding CI.
      - name: Unit tests (offline, no live infra)
        run: pytest tests/unit -q -p no:unraisableexception

  full-suite:
    # Only on PRs into main -- this is the expensive, live-infra gate
    # (docs/evaluation.md's own Phase 0-10 pattern: full suite once, not on
    # every push). lint-and-unit above is the fast, every-push signal.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.lock.txt
          pip install -e ".[dev]" -c requirements.lock.txt
      - name: Start Neo4j + Redis
        run: docker compose up -d neo4j redis
      - name: Wait for Neo4j bolt port
        run: |
          # docker-compose.yml shifts host ports by +1 (7688/6380, not the
          # container-internal 7687/6379) to avoid colliding with another
          # local project on the same dev machine -- see docker-compose.yml's
          # own comment. Using the container-internal port here was a real
          # bug caught before merge: the exact same wrong-port mistake this
          # session's Phase 10 load-test script hit and fixed
          # (docs/evaluation.md's B6 annotation documents that incident).
          for i in $(seq 1 60); do
            (echo > /dev/tcp/localhost/7688) 2>/dev/null && exit 0
            sleep 2
          done
          echo "Neo4j did not become reachable in time" >&2
          exit 1
      - name: Full test suite
        env:
          NEO4J_URI: bolt://localhost:7688
          REDIS_URL: redis://localhost:6380/0
        run: pytest tests/ -q -p no:unraisableexception
      - name: Tear down
        if: always()
        run: docker compose down
