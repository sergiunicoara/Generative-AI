[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiter-limina-benchmark"
version = "0.1.0"
description = "Isolated Limina and LLM-judge benchmark harness for recruiter-agent"
requires-python = ">=3.11"
dependencies = [
  "limina-ai==1.0.4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
limina-benchmark = "limina_benchmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "limina: requires LIMINA_API_KEY and makes a Limina evaluation request",
  "llm_eval: requires a reachable Recruiter Agent judge endpoint",
  "offline_eval: does not call external evaluation services",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
