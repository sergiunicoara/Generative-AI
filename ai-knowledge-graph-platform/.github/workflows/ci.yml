name: CI

# `make ci` already exists and is labeled "the one command CI runs: lint +
# unit tests (no live services, no Docker)" -- this workflow just wires that
# existing, deliberately-scoped target to GitHub Actions, which previously
# didn't exist for this repo at all (see docs/IMPLEMENTATION_AUDIT.md).
#
# Deliberately excluded from this workflow: scripts/run_golden_eval.py,
# scripts/_aerospace_regression.py, scripts/run_automotive_eval.py, and the
# adversarial security test corpus's live-model variants. Those make real,
# billed calls to Groq/DeepSeek/Cerebras against a live, pre-seeded Neo4j
# graph that doesn't exist in an ephemeral CI runner -- running them
# automatically on every push/PR (including from external forks) would be
# an unbounded, uncontrolled spend risk, not a safety improvement. They
# remain manually-invoked, exactly as before.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: make ci  (semantic-model-check + competency-questions-check + lint + unit tests)
        run: make ci

  live-tenant-isolation:
    # Real, live-data proof that tenant isolation holds -- not just that a
    # Cypher query string contains a tenant filter against a mock (which is
    # all tests/unit/test_tenant_isolation.py can prove). Uses testcontainers
    # to spin up a throwaway Neo4j Community container; no external service,
    # no API key, no paid call -- self-contained and safe to run on every
    # push/PR, unlike the golden-eval jobs excluded above.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Live tenant-isolation e2e test
        run: python scripts/run_pytest.py tests/e2e/test_live_tenant_isolation.py -v

  deterministic-retrieval-gate:
    # Seeded, LLM-free retrieval regression tripwire (docs/IMPLEMENTATION_AUDIT.md
    # item #2) -- recall@5/MRR over a tiny fixed fixture, BM25-over-Neo4j only
    # (vector search/reranker/GNN disabled), so no API key or model download is
    # needed. A separate job from live-tenant-isolation so a retrieval-quality
    # regression and a tenant-isolation regression are distinctly attributable.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Deterministic retrieval gate
        run: python scripts/run_pytest.py tests/e2e/test_retrieval_quality_gate.py -v
