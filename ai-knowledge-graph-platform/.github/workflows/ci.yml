name: CI

# Deliberately scoped to lint + unit tests only. There was no CI config in
# this repo at all before this workflow (confirmed: no .github/workflows/,
# .gitlab-ci.yml, Jenkinsfile, .circleci/ anywhere).
#
# Integration/e2e tests (tests/integration/, tests/e2e/) need live services
# — Neo4j, Redis, RabbitMQ, Blazegraph — which is real, separately-scoped
# work (a Docker-backed CI job), not silently dropped from this pass: it's
# the one wishlist item ("local triplestore deployment") this batch of
# no-Docker items explicitly did not attempt. Add a second job here with
# `services:` containers when that's picked up.
#
# Runs exactly `make ci` so what passes here is provably the same thing a
# developer can run locally before pushing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint + unit tests
        run: make ci
