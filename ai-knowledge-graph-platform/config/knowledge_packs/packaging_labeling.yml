    recorded_at: "2025-12-15T00:00:00Z"

  - <<: *common
    id: PKG-009
    version: 1
    title: Southland storage statement
    statement: "DEMO RULE. Southland cartons state 'Store below 25 C'."
    subject_key: label.storage_statement
