  - <<: *common
    id: PKG-006
    version: 1
    title: MegaMart permits the 'clinically proven' claim (customer guidance)
    statement: "DEMO GUIDANCE. MegaMart artwork may carry a 'clinically proven' claim."
    subject_key: label.front_claims.clinically_proven
    modality: permitted
    authority: customer
    status: published
    review_ref: DEMO-REVIEW-006
    applicability:
