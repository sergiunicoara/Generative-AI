    version: 1
    title: No 'clinically proven' front-panel claim in Northland
    statement: "DEMO RULE. Northland front panels do not carry a 'clinically proven' claim."
    subject_key: label.front_claims.clinically_proven
    modality: prohibited
    authority: regulatory
    status: published
    review_ref: DEMO-REVIEW-005
    applicability:
      <<: *anywhere
      market: {mode: in, values: [NORTHLAND]}
    constraint:
      all_of:
        - {fact: label.front_claims, operator: contains, value: clinically_proven}
