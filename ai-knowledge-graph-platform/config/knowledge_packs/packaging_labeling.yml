# Synthetic packaging/labeling knowledge pack -- DEMONSTRATION DATA ONLY.
#
# Every requirement below is invented to exercise the contextual-knowledge
# evaluator. Markets ("NORTHLAND", "SOUTHLAND"), customers, brands, products and
# document ids are fictional. Nothing here restates, summarises or approximates
# an FDA, EMA, QRD or any other real regulatory requirement, and nothing here
# has been reviewed by a domain expert.
domain: packaging_labeling
tenant: packaging_demo
pack_version: "2026.10.24-demo"
description: >
  One OTC tablet carton family (PX-200, PX-200-MINI) assessed in two fictional
  markets, with customer and brand guidance, a mandatory baseline, an authorised
  exception, an unauthorised override attempt, contradictory requirements, a
  temporal revision, and entries in every lifecycle state.
disclaimer: >
  Demonstration rules, not regulatory requirements. Do not use for compliance.

x-common: &common
  tenant: packaging_demo
  access: {mode: tenant, state: known}
  reviewed_by: "user:demo-curator"
  constraint_provenance: &prov {authored_by: "user:demo-curator", approval_ref: "DEMO-APPROVAL-2026-001"}

x-all-dims: &anywhere
  customer: {mode: any}
  brand: {mode: any}
  market: {mode: any}
  product: {mode: any}
  product_family: {mode: any}
  workflow: {mode: any}

items:
  - <<: *common
    id: PKG-001
    version: 1
    title: Batch code printed on every OTC tablet carton
    statement: "DEMO RULE. Every OTC tablet carton carries a printed batch code."
    subject_key: label.batch_code
    modality: mandatory
    authority: regulatory
    status: published
    review_ref: DEMO-REVIEW-001
    applicability:
      <<: *anywhere
      product_family: {mode: in, values: [otc_tablets]}
      workflow: {mode: in, values: [label_review, artwork_change]}
      valid_from: "2026-01-01T00:00:00Z"
    constraint:
      all_of:
        - {fact: label.batch_code_present, operator: eq, value: true}
    sources:
      - {source_id: DEMO-STD-PKG-01, locator: "section 2.1", quote: "Batch code is printed on the carton."}
    recorded_at: "2025-12-15T00:00:00Z"

  - <<: *common
    id: PKG-007
    version: 1
    title: Baseline minimum font size (all markets)
    statement: "DEMO RULE. Body text on OTC tablet cartons is at least 6 pt."
    subject_key: label.min_font
    modality: mandatory
    authority: regulatory
    status: published
    review_ref: DEMO-REVIEW-007
    applicability:
      <<: *anywhere
      product_family: {mode: in, values: [otc_tablets]}
      valid_from: "2026-01-01T00:00:00Z"
    constraint:
      all_of:
        - {fact: label.min_font_pt, operator: gte, value: 6}
    sources:
      - {source_id: DEMO-STD-PKG-01, locator: "section 3.1"}
    recorded_at: "2025-12-15T00:00:00Z"

  - <<: *common
    id: PKG-002
    version: 1
    title: Northland minimum font size, revision 1
    statement: "DEMO RULE. In Northland, body text is at least 7 pt."
    subject_key: label.min_font
    series: northland.min_font
    modality: mandatory
    authority: regulatory
    status: published
    review_ref: DEMO-REVIEW-002
    applicability:
      <<: *anywhere
      market: {mode: in, values: [NORTHLAND]}
      product_family: {mode: in, values: [otc_tablets]}
      valid_from: "2026-01-01T00:00:00Z"
    constraint:
      all_of:
        - {fact: label.min_font_pt, operator: gte, value: 7}
    sources:
      - {source_id: DEMO-NL-GUIDE-R1, locator: "rule 4"}
    recorded_at: "2025-12-15T00:00:00Z"

  - <<: *common
    id: PKG-011
    version: 1
    title: Northland minimum font size, revision 2
    statement: "DEMO RULE. From 1 July 2026, in Northland, body text is at least 8 pt."
    subject_key: label.min_font
    series: northland.min_font
    modality: mandatory
    authority: regulatory
    status: published
    review_ref: DEMO-REVIEW-011
    supersedes: [PKG-002]
    applicability:
      <<: *anywhere
      market: {mode: in, values: [NORTHLAND]}
