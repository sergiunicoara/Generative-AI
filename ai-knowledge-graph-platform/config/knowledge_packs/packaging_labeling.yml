    recorded_at: "2025-12-15T00:00:00Z"

  - <<: *common
    id: PKG-015
    version: 1
    title: Northland registration number (restricted to regulatory affairs)
    statement: "DEMO RULE. Northland cartons show the product registration number."
    subject_key: label.registration_number
    modality: mandatory
    authority: regulatory
    status: published
    review_ref: DEMO-REVIEW-015
    access:
      mode: restricted
      state: known
      allow_principals: ["group:regulatory-affairs"]
      requires_group_resolution: true
    applicability:
      <<: *anywhere
      market: {mode: in, values: [NORTHLAND]}
    constraint:
