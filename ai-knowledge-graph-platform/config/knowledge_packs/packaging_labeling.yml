  - <<: *common
    id: PKG-012
    version: 1
    title: Allergen statement present (absence is a violation)
    statement: "DEMO RULE. Every carton carries an allergen statement; an absent statement is non-compliant."
    subject_key: label.allergen_statement
    modality: mandatory
    authority: regulatory
    status: published
    review_ref: DEMO-REVIEW-012
    applicability:
      <<: *anywhere
      product_family: {mode: in, values: [otc_tablets]}
    constraint:
      all_of:
        - {fact: label.allergen_statement, operator: not_empty, when_missing: violation}
    sources:
