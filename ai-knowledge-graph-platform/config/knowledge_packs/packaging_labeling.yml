  - <<: *common
    id: PKG-008
    version: 1
    title: Sunleaf mini-pack font size (brand rule claiming an override)
    statement: "DEMO RULE. Sunleaf mini-packs may use 5 pt body text, overriding the baseline."
    subject_key: label.min_font
    modality: mandatory
    authority: brand
    status: published
    review_ref: DEMO-REVIEW-008
