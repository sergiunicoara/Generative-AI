# Automotive IATF 16949 Quality Management Knowledge Graph Ontology
#
# Domain-specific type hierarchy and relation schema for the PlastiAuto SRL /
# AutoCorp GmbH demo corpus — supplier qualification, client-specific
# requirements (CSR), quality procedures (IATF 16949 / ISO 9001), KPI
# monitoring, non-conformity management, and document revision control.
#
# Provenance:
#   Schema written for the 30-document automotive corpus (data/automotive/),
#   tuned around the 5 ground-truth contradictions (C01-C05) used in
#   data/eval_golden/queries_automotive.json:
#     C01 - minimum competitive offers required for new-supplier approval
#     C02 - mandatory on-site audit before supplier approval
#     C03 - supplier reevaluation frequency (semestrial vs annual)
#     C04 - stale procedure-revision references (IL-INS-03 rev.2 vs rev.4)
#     C05 - reevaluation frequency for CRITICAL suppliers vs all suppliers
#
# Load (mirrors aerospace_regulatory.yml):
#   from graphrag.graph.domain_ontology import load_domain_ontology
#   ontology = load_domain_ontology("config/ontologies/automotive_iatf.yml")
#   await taxonomy.load(extra_pairs=get_type_hierarchy_pairs(ontology))
#   registry.add_domain_range_rules(get_relation_rules(ontology))
#
# Tenant-flexible discovery:
#   graphrag.graph.domain_ontology.get_ontology_path_for_tenant("automotive")
#   resolves to this file by filename convention ({tenant}_*.yml).

# ── Entity type extensions ─────────────────────────────────────────────────────
# Format: [child_type, parent_type]  (parent must exist in base hierarchy or here)

ontology:
  id: automotive-iatf
  version: "1.0.0"
  status: active
  compatible_with: ">=1.0.0"
  deprecated_types: []
  deprecated_relations: []

type_hierarchy:
  # Organizations
  - [SUPPLIER,                  ORG]           # PlastiAuto SRL and any sub-tier supplier
  - [CLIENT_ORG,                ORG]           # AutoCorp GmbH — issues CSR

  # Quality documents (CONCEPT subtree)
  - [QUALITY_DOCUMENT,          CONCEPT]       # base type for all controlled documents
  - [CLIENT_REQUIREMENT,        QUALITY_DOCUMENT]  # CSR-CLIENT-* — highest authority
  - [QUALITY_MANUAL,            QUALITY_DOCUMENT]  # MC-01 — top internal QMS doc
  - [INTERNAL_PROCEDURE,        QUALITY_DOCUMENT]  # PQ-*, IL-*, RFA-*, PC-*, PAI-*,
                                                    # PFMEA-*, PPAP-*, PTRN-*, SPEC-*, PCAL-*, PN-*
  - [FORM_RECORD,               QUALITY_DOCUMENT]  # FP-*, REG-* — working forms/registers

  # Standards & frameworks
  - [STANDARD,                  CONCEPT]       # IATF 16949, ISO 9001, ISO 14001, ISO 45001

  # Performance & process concepts
  - [KPI,                       CONCEPT]       # OTD, defect rate (PPM), FPY, Cpk, etc.
  - [QUALITY_PROCESS,           CONCEPT]       # AUDIT, FAI, SPC, MSA, PPAP, 8D
  - [AUDIT,                     QUALITY_PROCESS]
  - [NONCONFORMITY,             CONCEPT]       # Minor / Major / Critical NCR
  - [SUPPLIER_CLASSIFICATION,   CONCEPT]       # Preferred / Standard / On Watch / Suspended
  - [REEVALUATION_FREQUENCY,    CONCEPT]       # Semestrial / Annual — directly tests C03/C05

  # Products
  - [AUTOMOTIVE_COMPONENT,      PRODUCT]       # parts/components covered by FAI/PPAP

# ── Relation schema extensions ─────────────────────────────────────────────────
# These extend the domain/range rules in graphrag/graph/ontology_registry.py.
# Loaded via: registry.add_domain_range_rules(get_relation_rules(ontology))

relation_rules:
  # Document revision control — central to C04
  SUPERSEDES:
    domain: [QUALITY_DOCUMENT, CLIENT_REQUIREMENT, INTERNAL_PROCEDURE]
    target: [QUALITY_DOCUMENT, CLIENT_REQUIREMENT, INTERNAL_PROCEDURE]
    note: "IL-INS-03-rev4 supersedes IL-INS-03-rev2; PQ-07-rev3 supersedes PQ-07-rev1; CSR-CLIENT-2023 supersedes CSR-CLIENT-2021"

  REFERENCES:
    domain: [QUALITY_DOCUMENT, INTERNAL_PROCEDURE]
    target: [QUALITY_DOCUMENT, INTERNAL_PROCEDURE]
    note: "PC-COMP-07-rev3 references IL-INS-03 rev.2 — a stale reference once rev.4 is current (C04)"

  # Client / supplier requirement chain
  MANDATES:
    domain: [CLIENT_REQUIREMENT, CLIENT_ORG]
    target: [SUPPLIER, INTERNAL_PROCEDURE, QUALITY_PROCESS, KPI]
    inverse: MANDATED_BY
    note: "CSR-CLIENT-2023 mandates mandatory on-site audit (C02), 3-offer rule (C01), semestrial reevaluation of critical suppliers (C05)"

  MANDATED_BY:
    domain: [SUPPLIER, INTERNAL_PROCEDURE, QUALITY_PROCESS, KPI]
    target: [CLIENT_REQUIREMENT, CLIENT_ORG]

  APPLIES_TO:
    domain: [QUALITY_DOCUMENT, STANDARD]
    target: [SUPPLIER, SUPPLIER_CLASSIFICATION, AUTOMOTIVE_COMPONENT]

  # Supplier lifecycle
  SUPPLIES_TO:
    domain: [SUPPLIER]
    target: [CLIENT_ORG]
    inverse: SOURCES_FROM

  CLASSIFIED_AS:
    domain: [SUPPLIER]
    target: [SUPPLIER_CLASSIFICATION]
    note: "Preferred / Standard / On Watch / Suspended — driven by KPI thresholds"

  REEVALUATED_AT:
    domain: [SUPPLIER, SUPPLIER_CLASSIFICATION]
    target: [REEVALUATION_FREQUENCY]
    note: "C03/C05 — critical suppliers REEVALUATED_AT Semestrial per CSR/RFA-REG-01; general suppliers per PQ-07/MC-01"

  # Audits & compliance
  AUDITS:
    domain: [CLIENT_ORG]
    target: [SUPPLIER]
    inverse: AUDITED_BY

  REQUIRES:
    domain: [CLIENT_REQUIREMENT, INTERNAL_PROCEDURE, STANDARD]
    target: [QUALITY_PROCESS, AUDIT, KPI]
    note: "CSR-CLIENT-2023 REQUIRES on-site AUDIT before approval (C02); IL-PROC-12 REQUIRES minimum offers (C01)"

  COMPLIES_WITH:
    domain: [SUPPLIER, QUALITY_DOCUMENT]
    target: [STANDARD]
    inverse: GOVERNS

  MONITORED_BY:
    domain: [SUPPLIER, SUPPLIER_CLASSIFICATION]
    target: [KPI]

  ESCALATES_TO:
    domain: [NONCONFORMITY]
    target: [QUALITY_PROCESS]
    note: "Major/Critical NCR escalates to 8D report"

# ── Inference rules (automotive-specific) ──────────────────────────────────────
# Supplement the built-in rules in graphrag/graph/inference_engine.py.

inference_rules:
  - name: supersedes_transitivity
    relation: SUPERSEDES
    rule_type: transitivity
    max_depth: 3
    confidence_decay: 0.95
    note: >
      If CSR-CLIENT-2023 supersedes CSR-CLIENT-2021, and a future revision
      supersedes CSR-CLIENT-2023, the newest revision transitively supersedes
      the oldest. Lets retrieval always resolve to the currently-binding
      requirement (C04 reference resolution).

  - name: mandates_inverse
    relation: MANDATES
    rule_type: inverse
    derived_relation: MANDATED_BY
    note: "If CLIENT_REQUIREMENT MANDATES a control, that control is MANDATED_BY the requirement."

  - name: audits_inverse
    relation: AUDITS
    rule_type: inverse
    derived_relation: AUDITED_BY

  - name: supplies_to_inverse
    relation: SUPPLIES_TO
    rule_type: inverse
    derived_relation: SOURCES_FROM

# ── Exclusive state pairs (contradiction detection) ────────────────────────────
# Extends the default pairs in contradiction_strategies.py. Each pair maps
# directly to one of the 5 ground-truth contradictions in this corpus.

exclusive_state_pairs:
  - [REEVALUATED_SEMESTRIAL,      REEVALUATED_ANNUAL]       # C03 / C05
  - [AUDIT_ON_SITE_MANDATORY,     AUDIT_ON_SITE_NOT_REQUIRED]  # C02
  - [REQUIRES_THREE_OFFERS,       REQUIRES_TWO_OFFERS]      # C01
  - [IS_CURRENT_REVISION,         IS_SUPERSEDED_REVISION]   # C04
  - [PREFERRED_SUPPLIER,          SUPPLIER_ON_WATCH]
  - [PREFERRED_SUPPLIER,          SUSPENDED_SUPPLIER]

# ── Functional relations (one-to-one per time window) ─────────────────────────
# Extends functional_relations in contradiction_strategies.py.

functional_relations:
  - CURRENT_REVISION_OF          # a procedure code (e.g. IL-INS-03) has exactly one current revision
  - REEVALUATION_FREQUENCY_OF    # a supplier/classification has exactly one active reevaluation cadence
  - CLASSIFIED_AS                # a supplier has exactly one active classification

# ── Authority levels for this domain ──────────────────────────────────────────
# Mirrors the AuthorityLevel enum (graphrag/core/models.py) — lower = higher
# authority. Used by ingest_corpus.py's per-tenant authority map.

authority_levels:
  CLIENT_REQUIREMENT:   1   # CSR-CLIENT-* — AutoCorp GmbH mandates, prevails in conflicts (AUTH-01)
  QUALITY_MANUAL:       2   # MC-01-* — top-level internal QMS
  INTERNAL_PROCEDURE:   3   # PQ-*, IL-*, RFA-*, PC-*, PAI-*, PFMEA-*, PPAP-*, PTRN-*, SPEC-*, PCAL-*, PN-*
  FORM_RECORD:          4   # FP-*, REG-* — working forms and registers

# ── Document prefix -> type/authority map ──────────────────────────────────────
# Reference table for the ingestion script's per-document authority assignment
# and entity-type seeding. Not consumed directly by domain_ontology.py — kept
# here so the ontology stays the single source of truth for "what kind of
# document is this" as the corpus grows.

document_prefixes:
  CSR-CLIENT:   { type: CLIENT_REQUIREMENT, authority: 1 }
  MC-01:        { type: QUALITY_MANUAL,     authority: 2 }
  PQ:           { type: INTERNAL_PROCEDURE, authority: 3 }
  IL:           { type: INTERNAL_PROCEDURE, authority: 3 }
  RFA:          { type: INTERNAL_PROCEDURE, authority: 3 }
  PC:           { type: INTERNAL_PROCEDURE, authority: 3 }
  PAI:          { type: INTERNAL_PROCEDURE, authority: 3 }
  PFMEA:        { type: INTERNAL_PROCEDURE, authority: 3 }
  PPAP:         { type: INTERNAL_PROCEDURE, authority: 3 }
  PTRN:         { type: INTERNAL_PROCEDURE, authority: 3 }
  SPEC:         { type: INTERNAL_PROCEDURE, authority: 3 }
  PCAL:         { type: INTERNAL_PROCEDURE, authority: 3 }
  PN:           { type: INTERNAL_PROCEDURE, authority: 3 }
  FP:           { type: FORM_RECORD,        authority: 4 }
  REG:          { type: FORM_RECORD,        authority: 4 }

# ── Known revision-supersession chains ─────────────────────────────────────────
# Reference table mirroring _SUPERSESSION_MAP in ingest_corpus.py. Listed here
# so the ontology and the ingestion script stay in sync as new revisions land.

supersession_chains:
  - successor:   CSR-CLIENT-2023.txt
    predecessor: CSR-CLIENT-2021.txt
  - successor:   PQ-07-rev3.txt
    predecessor: PQ-07-rev1.txt
  - successor:   IL-INS-03-rev4.txt
    predecessor: IL-INS-03-rev2.txt

# ── Vocabulary ────────────────────────────────────────────────────────────────
# Definitions restate the notes beside each type in type_hierarchy above; synonyms are the abbreviations used in the
# corpus. Read by graphrag/graph/skos_export.py (skos:definition / skos:altLabel).
vocabulary:
  SUPPLIER:
    definition: "An organisation that supplies parts to a client, such as PlastiAuto SRL or a sub-tier supplier."
  CLIENT_ORG:
    definition: "A client organisation that buys from suppliers and issues client-specific requirements."
  QUALITY_DOCUMENT:
    definition: "Any controlled document of the quality management system."
  CLIENT_REQUIREMENT:
    definition: "A client-specific requirement document (CSR-CLIENT-*), the highest-authority quality document."
    synonyms: ["CSR"]
  QUALITY_MANUAL:
    definition: "The top-level internal quality management system document (MC-01)."
  INTERNAL_PROCEDURE:
    definition: "An internal procedure, instruction or plan of the supplier (PQ-*, IL-*, RFA-*, PC-*, PFMEA-*, PPAP-*)."
  FORM_RECORD:
    definition: "A working form or register (FP-*, REG-*)."
  STANDARD:
    definition: "A published standard or framework, such as IATF 16949, ISO 9001, ISO 14001 or ISO 45001."
  KPI:
    definition: "A performance indicator, such as on-time delivery, defect rate in PPM, first pass yield or Cpk."
    synonyms: ["key performance indicator"]
  QUALITY_PROCESS:
    definition: "A quality process such as an audit, first article inspection, SPC, MSA, PPAP or 8D."
  AUDIT:
    definition: "An examination of a supplier or process against a requirement."
  NONCONFORMITY:
    definition: "A recorded failure to meet a requirement, classed as minor, major or critical."
    synonyms: ["NCR"]
  SUPPLIER_CLASSIFICATION:
    definition: "A supplier's standing: preferred, standard, on watch or suspended."
  REEVALUATION_FREQUENCY:
    definition: "How often a supplier is reevaluated: semestrial or annual."
  AUTOMOTIVE_COMPONENT:
    definition: "A part or component covered by first article inspection or PPAP."
