# Synthetic local ontology for the relational-to-graph demonstration.
# It contains no real supplier, emissions, or assessment data.
ontology:
  id: synthetic-sustainability-supply-chain
  version: "1.0.0"
  status: active
  compatible_with: ">=1.0.0"
  deprecated_types: []
  deprecated_relations: []

type_hierarchy:
  - [SUPPLIER, ORG]
  - [FACILITY, LOCATION]
  - [MATERIAL, PRODUCT]
  - [EMISSIONS_RECORD, EVENT]
  - [ASSESSMENT, EVENT]
  - [RISK, CONCEPT]
  - [EVIDENCE, CONCEPT]
  # GLEIF Level-1 golden-record entity (see ontology/mappings/gleif-lei.r2rml.ttl).
  # Not joined to SUPPLIER at the ontology-relation level: cross-source
  # identity reconciliation is an entity-resolution-time concern, not a
  # domain-ontology one -- see that mapping file's header comment.
  - [LEGAL_ENTITY_RECORD, ORG]

relation_rules:
  SUPPLIES:
    domain: [SUPPLIER]
    target: [MATERIAL]
  OPERATES:
    domain: [SUPPLIER]
    target: [FACILITY]
  REPORTED:
    domain: [SUPPLIER]
    target: [EMISSIONS_RECORD]
  HAS_EVIDENCE:
    domain: [ASSESSMENT, EMISSIONS_RECORD, RISK]
    target: [EVIDENCE]
  HAS_RISK:
    domain: [SUPPLIER, FACILITY, MATERIAL]
    target: [RISK]

inference_rules: []
exclusive_state_pairs: []
functional_relations: []
