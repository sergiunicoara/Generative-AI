apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphrag-api
  namespace: graphrag
  labels:
    app.kubernetes.io/name: graphrag-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: graphrag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphrag-api
    spec:
      serviceAccountName: graphrag-workload
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT_ID/graphrag/api:TAG
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: {name: graphrag-config}
            - secretRef: {name: graphrag-secrets}
          env:
            - name: TMPDIR
              value: /tmp
            - name: ENERGY_GOVERNANCE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: graphrag-secrets
                  key: ENERGY_GOVERNANCE_DB_URL
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: energy-published-rdf
              mountPath: /data/energy
      volumes:
        - name: tmp
          emptyDir: {}
        - name: energy-published-rdf
          persistentVolumeClaim:
            claimName: energy-published-rdf
---
apiVersion: v1
kind: Service
metadata:
  name: graphrag-api
  namespace: graphrag
spec:
  selector:
    app.kubernetes.io/name: graphrag-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphrag-api
  namespace: graphrag
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: graphrag-api}
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: graphrag-api
  namespace: graphrag
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: graphrag-api
