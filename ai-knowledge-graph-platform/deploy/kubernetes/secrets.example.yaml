# Replace every value with a base64-encoded production value, or use External
# Secrets / Secret Manager. This file is a schema only and must never contain
# real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: graphrag-secrets
  namespace: graphrag
type: Opaque
data:
  NEO4J_URI: REPLACE_ME
  NEO4J_USER: REPLACE_ME
  NEO4J_PASSWORD: REPLACE_ME
  RABBITMQ_URL: REPLACE_ME
  REDIS_URL: REPLACE_ME
  TIMESCALE_DB_URL: REPLACE_ME
  # Shared async PostgreSQL database for the Energy publication/workflow state.
  ENERGY_GOVERNANCE_DB_URL: REPLACE_ME
  JWT_SECRET_KEY: REPLACE_ME
  SESSION_SECRET_KEY: REPLACE_ME
  OPENAI_API_KEY: REPLACE_ME
  DEEPSEEK_API_KEY: REPLACE_ME
  GROQ_API_KEY: REPLACE_ME
