# Pin the Compose project name to match the current default (derived from this
# directory's current name). Without this, renaming/moving this directory (or
# running `docker-compose up` from a different cwd) changes the project name,
# which changes the named-volume names Compose looks for — Compose then
# creates fresh empty volumes instead of reattaching to neo4j_data/neo4j_logs.
# This is what orphaned the aerospace tenant data on 2026-06-10.
name: ai-knowledge-graph-platform

services:
  neo4j:
    image: neo4j:5.20-community
    container_name: graphrag_neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/graphrag_dev
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "graphrag_dev", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: graphrag_rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: graphrag
      RABBITMQ_DEFAULT_PASS: graphrag_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: graphrag_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: graphrag_timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag_dev
      POSTGRES_DB: graphrag
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag -d graphrag"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional live SPARQL endpoint mirroring the RDF export produced by
  # scripts/export_rdf.py -- see scripts/load_blazegraph.py. Nothing else
  # depends_on this service; it is not on the critical path of a normal
  # `docker-compose up`. See docs/adr/0001-property-graph-over-triple-store.md
  # (Addendum) for why this doesn't reverse that ADR's core decision.
  blazegraph:
    image: lyrasis/blazegraph:2.1.5
    container_name: graphrag_blazegraph
    ports:
      # Bound to loopback deliberately. Blazegraph ships with no authentication,
      # and its SPARQL endpoint accepts Update as well as LOAD/SERVICE -- i.e.
      # exactly the SSRF and write primitives graphrag/graph/sparql_bridge.py
      # goes out of its way to block at the API. Publishing it on 0.0.0.0 would
      # hand all of that to anything that can route to this host. Reachable from
      # sibling containers by service name regardless of this binding.
      # Container listens on 8080, not 9999: lyrasis/blazegraph:2.1.5 runs the
      # bigdata.war under Jetty on 8080. Host port 9999 is kept as the external
      # convention the load script defaults to.
      - "127.0.0.1:9999:8080"
    volumes:
      - blazegraph_data:/data
    healthcheck:
      # Verified against lyrasis/blazegraph:2.1.5 (digest sha256:56be5edb…):
      # both curl and wget are present, and the webapp context path is
      # /bigdata (NOT /blazegraph, which 404s on this image).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/bigdata/status"]
      interval: 15s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    container_name: graphrag_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      RABBITMQ_URL: amqp://graphrag:graphrag_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      KPI_DB_PATH: /data/kpis.db
      KPI_BACKEND: timescale
      TIMESCALE_DB_URL: postgresql+asyncpg://graphrag:graphrag_dev@timescaledb:5432/graphrag
      PROMETHEUS_METRICS_TOKEN: ${PROMETHEUS_METRICS_TOKEN:?Set PROMETHEUS_METRICS_TOKEN in .env}
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - kpi_data:/data

  ingestion_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ingestion
    command: python workers/ingestion_worker.py
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      RABBITMQ_URL: amqp://graphrag:graphrag_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "8081"
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  query_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: query
    container_name: graphrag_query_worker
    command: python workers/query_worker.py
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      RABBITMQ_URL: amqp://graphrag:graphrag_dev@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      KPI_DB_PATH: /data/kpis.db
      KPI_BACKEND: timescale
      TIMESCALE_DB_URL: postgresql+asyncpg://graphrag:graphrag_dev@timescaledb:5432/graphrag
      # The Dockerfile's non-root "app" user has no real home directory
      # (HOME=/nonexistent), so huggingface_hub's default ~/.cache/huggingface
      # cache-dir resolution fails with PermissionError on first model load.
      # Point it at a writable path instead.
      HF_HOME: /tmp/huggingface
      TRANSFORMERS_CACHE: /tmp/huggingface
      WORKER_HEALTH_PORT: "8082"
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - kpi_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  evaluation_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: evaluation
    container_name: graphrag_eval_worker
    command: python workers/evaluation_worker.py
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://graphrag:graphrag_dev@rabbitmq:5672/
      KPI_DB_PATH: /data/kpis.db
      KPI_BACKEND: timescale
      TIMESCALE_DB_URL: postgresql+asyncpg://graphrag:graphrag_dev@timescaledb:5432/graphrag
      WORKER_HEALTH_PORT: "8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    volumes:
      - .:/app
      - kpi_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: dashboard
    container_name: graphrag_dashboard
    command: python graphrag/business_matrix/dashboard_server.py
    ports:
      - "8050:8050"
    env_file: .env
    environment:
      KPI_DB_PATH: /data/kpis.db
      KPI_BACKEND: timescale
      TIMESCALE_DB_URL: postgresql+asyncpg://graphrag:graphrag_dev@timescaledb:5432/graphrag
    volumes:
      - .:/app
      - kpi_data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: graphrag_prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    entrypoint:
      - /bin/sh
      - -ec
      - |
        printf '%s' "$$PROMETHEUS_METRICS_TOKEN" > /tmp/prometheus-metrics-token
        exec /bin/prometheus "$${@}"
      - --
    environment:
      PROMETHEUS_METRICS_TOKEN: ${PROMETHEUS_METRICS_TOKEN:?Set PROMETHEUS_METRICS_TOKEN in .env}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/rules/graphrag-alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    container_name: graphrag_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/graphrag-overview.json:/var/lib/grafana/dashboards/graphrag-overview.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
  kpi_data:
  timescale_data:
  prometheus_data:
  grafana_data:
  redis_data:
  blazegraph_data:
