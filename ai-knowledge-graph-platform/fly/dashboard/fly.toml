app = "graphrag-dashboard-sn"
primary_region = "ams"

[build]
  dockerfile = "../../Dockerfile"
  [build.args]
    SERVICE = "dashboard"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONPATH = "/app"
  ENV = "production"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8050
  processes = ["app"]
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[mounts]]
  source = "kpi_data"
  destination = "/data"

[vm]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Without this the machine runs the Dockerfile's default CMD (uvicorn api.main
# on :8000), which is not the dashboard and does not listen on internal_port.
[processes]
  app = "python graphrag/business_matrix/dashboard_server.py"
