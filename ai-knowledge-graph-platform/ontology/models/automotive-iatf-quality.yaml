id: automotive-iatf-quality
version: 1.0.0
namespace: https://example.automotive.demo/ontology#
label: Automotive IATF 16949 Quality Management ontology
unknown_property_policy: reject
prefixes:
  prov: http://www.w3.org/ns/prov#
mixins:
  Auditable:
    label: Auditable
    description: Shared lifecycle metadata without asserting an inheritance class.
    properties:
      createdAt:
        datatype: dateTime
      updatedAt:
        datatype: dateTime
types:
  Organization:
    label: Organization
    lpg_label: ORG
    abstract: true
    mixins: [Auditable]
  Supplier:
    label: Supplier
    lpg_label: SUPPLIER
    extends: Organization
    properties:
      supplierId:
        datatype: string
        required: true
        key: true
      classification:
        datatype: string
        description: One of "approved", "conditional", "disqualified" -- the supplier's current qualification status.
      reevaluationFrequencyMonths:
        datatype: integer
        description: Retention/cadence control -- how often this supplier must be reassessed against IATF 16949.
  ClientOrg:
    label: Client organization
    lpg_label: CLIENT_ORG
    extends: Organization
  QualityDocument:
    label: Quality document
    lpg_label: QUALITY_DOCUMENT
    abstract: true
    mixins: [Auditable]
    properties:
      documentId:
        datatype: string
        required: true
        key: true
      retentionPeriodYears:
        datatype: integer
        description: How long this document or record must be retained for audit purposes.
  ClientRequirement:
    label: Client requirement
    lpg_label: CLIENT_REQUIREMENT
    extends: QualityDocument
  QualityManual:
    label: Quality manual
    lpg_label: QUALITY_MANUAL
    extends: QualityDocument
  InternalProcedure:
    label: Internal procedure
    lpg_label: INTERNAL_PROCEDURE
    extends: QualityDocument
  FormRecord:
    label: Form or record
    lpg_label: FORM_RECORD
    extends: QualityDocument
  Standard:
    label: Standard
    lpg_label: STANDARD
    mixins: [Auditable]
    properties:
      standardId:
        datatype: string
        required: true
        key: true
      title:
        datatype: string
  QualityProcess:
    label: Quality process
    lpg_label: QUALITY_PROCESS
    abstract: true
    mixins: [Auditable]
  Audit:
    label: Audit
    lpg_label: AUDIT
    extends: QualityProcess
    properties:
      auditorId:
        datatype: string
        required: true
        description: Actor identity for the audit trail -- who performed this audit.
      scheduledAt:
        datatype: dateTime
      completedAt:
        datatype: dateTime
      outcome:
        datatype: string
        description: One of "pass", "conditional", "fail".
  Nonconformity:
    label: Nonconformity
    lpg_label: NONCONFORMITY
    extends: QualityProcess
    properties:
      severity:
        datatype: string
        description: One of "minor", "major", "critical".
      rootCause:
        datatype: string
        description: Explainability -- why this nonconformity occurred, not just that it did.
      correctiveAction:
        datatype: string
      closedAt:
        datatype: dateTime
        required: false
  AutomotiveComponent:
    label: Automotive component
    lpg_label: AUTOMOTIVE_COMPONENT
    mixins: [Auditable]
    properties:
      partNumber:
        datatype: string
        required: true
        key: true
      description:
        datatype: string
  KPI:
    label: KPI
    lpg_label: KPI
    mixins: [Auditable]
    properties:
      name:
        datatype: string
        required: true
        key: true
      targetValue:
        datatype: decimal
      actualValue:
        datatype: decimal
relations:
  suppliesTo:
    source: Supplier
    target: ClientOrg
    lpg_type: SUPPLIES_TO
  sourcesFrom:
    source: ClientOrg
    target: Supplier
    lpg_type: SOURCES_FROM
  audits:
    source: Audit
    target: Supplier
    lpg_type: AUDITS
  identifiedIn:
    source: Nonconformity
    target: Audit
    lpg_type: IDENTIFIED_IN
  mandates:
    source: Standard
    target: QualityDocument
    lpg_type: MANDATES
  compliesWith:
    source: Supplier
    target: Standard
    lpg_type: COMPLIES_WITH
  appliesTo:
    source: QualityDocument
    target: AutomotiveComponent
    lpg_type: APPLIES_TO
  references:
    source: QualityDocument
    target: QualityDocument
    lpg_type: REFERENCES
  supersedes:
    source: QualityDocument
    target: QualityDocument
    lpg_type: SUPERSEDES
  monitoredBy:
    source: KPI
    target: QualityProcess
    lpg_type: MONITORED_BY
  escalatesTo:
    source: Nonconformity
    target: ClientOrg
    lpg_type: ESCALATES_TO
# Ontology actions and functions (ADR-0015). Actions change one object through
# a checked, logged and (where declared) approved proposal; functions are
# read-only. Neither changes the compiled OWL/SHACL/Neo4j artifacts.
functions:
  audit_count:
    label: Audits of the supplier
    applies_to: Supplier
    kind: relation_count
    relation: audits
    direction: in
  classification:
    label: Current qualification status
    applies_to: Supplier
    kind: property
    property: classification
actions:
  disqualify_supplier:
    label: Disqualify a supplier
    description: Set the supplier's classification to disqualified on audit evidence.
    applies_to: Supplier
    parameters:
      reason:
        datatype: string
        required: true
        max_length: 2000
        description: Why the supplier is disqualified, with the audit evidence.
    submission_criteria:
      - id: not_already_disqualified
        subject: property:classification
        op: ne
        value: disqualified
        message: The supplier is already disqualified.
      - id: audit_evidence
        subject: function:audit_count
        op: min
        value: 1
        message: A supplier is disqualified on audit evidence; this one has no recorded audit.
      - id: reason_given
        subject: parameter:reason
        op: min_length
        value: 10
        message: State the reason (at least 10 characters).
    effects:
      - property: classification
        value: disqualified
    requires_approval: true
  requalify_supplier:
    label: Requalify a disqualified supplier
    description: Return a disqualified supplier to approved or conditional status.
    applies_to: Supplier
    parameters:
      classification:
        datatype: string
        required: true
        allowed: [approved, conditional]
      reason:
        datatype: string
        required: true
        max_length: 2000
    submission_criteria:
      - id: is_disqualified
        subject: property:classification
        op: eq
        value: disqualified
        message: Only a disqualified supplier can be requalified.
      - id: reason_given
        subject: parameter:reason
        op: min_length
        value: 10
        message: State the reason (at least 10 characters).
    effects:
      - property: classification
        from_parameter: classification
    requires_approval: true
  set_reevaluation_frequency:
    label: Set the reassessment cadence
    description: Set how often, in months, the supplier is reassessed.
    applies_to: Supplier
    parameters:
      months:
        datatype: integer
        required: true
    submission_criteria:
      - id: within_policy
        subject: parameter:months
        op: max
        value: 36
        message: Suppliers are reassessed at least every 36 months.
      - id: positive
        subject: parameter:months
        op: min
        value: 1
        message: The cadence is at least one month.
    effects:
      - property: reevaluationFrequencyMonths
        from_parameter: months
    requires_approval: false
artifacts:
  owl: ontology/automotive/automotive-iatf-quality.ttl
  shacl: ontology/shapes/automotive-iatf-quality.shapes.ttl
  neo4j: ontology/generated/automotive/neo4j-constraints.cypher
  diagnostics: ontology/generated/automotive/diagnostics.json
  diagnostics_report: ontology/generated/automotive/diagnostics.md
  erd: ontology/generated/automotive/erd.mmd
  capability_matrix: ontology/generated/automotive/capability-matrix.json
  gql: ontology/generated/automotive/graph-type.gql
