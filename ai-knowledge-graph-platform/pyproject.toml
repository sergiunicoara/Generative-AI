[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphrag*", "api*", "workers*", "mcp_server*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]          # line length is not enforced; see CONTRIBUTING

[tool.ruff.lint.per-file-ignores]
# Standalone CLI scripts insert the repo root on sys.path before importing
# graphrag, so their imports legitimately follow executable statements.
"scripts/*.py"     = ["E402"]
"scripts/**/*.py"  = ["E402"]
# Worker entry points must configure Windows stdout/stderr before importing
# logging and worker modules, so their imports intentionally follow setup.
"workers/*.py"     = ["E402"]

[tool.pytest.ini_options]
asyncio_mode        = "auto"          # no need for @pytest.mark.asyncio on every test
asyncio_default_fixture_loop_scope = "function"
testpaths           = ["tests"]
addopts             = "-v --tb=short"
filterwarnings      = [
    "ignore::DeprecationWarning:scipy",
    "ignore::numba.core.errors.NumbaDeprecationWarning",
]
markers             = [
    "asyncio: run the test in an asyncio event loop",
]

# Mutation testing (mutmut 3.x; run via `make mutation`, opt-in, slow). Targets the small
# high-risk adapters; inspect surviving mutants before merge.
[tool.mutmut]
source_paths = ["graphrag/retrieval/answer_policy.py", "mcp_server/transport_20260728.py", "graphrag/ingestion/r2rml.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_answer_policy.py", "tests/unit/test_mcp_transport_20260728.py", "tests/unit/test_ingest_r2rml.py", "tests/unit/test_r2rml_obda.py", "tests/unit/test_r2rml_rdf_materialization.py"]
also_copy = ["graphrag", "mcp_server", "api", "config", "ontology", "scripts", "evals"]
do_not_mutate = []
debug = true
