[project]
name = "sales-context-graph"
version = "0.1.0"
description = "CRM + sales-call transcripts -> Neo4j knowledge graph -> query-specific context graphs for sales teams."
requires-python = ">=3.11"
# Was ">=3.12" -- verified drift (docs/evaluation.md's Showpad engineering-
# rigor assessment, 2026-08-08, Band 1): ruff and the Dockerfile also
# declared 3.12 while the entire development/test cycle for this repo,
# including the full test suite and Phase 10's load-test baseline, ran on
# 3.11.6. Lowered to match the version actually proven to work rather than
# bumping to the untested one -- the safer direction for a drift fix.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    "neo4j>=5.24",
    "langgraph>=0.2",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.3",
    # Used by src/core/redis_client.py (the durable ingestion job store, see
    # api/state.py::RedisIngestionStore) when REDIS_URL is set, and by
    # src/graph/alias_registry.py's optional warm-cache path, which fails open
    # (returns None) if Redis is unreachable. No Redis service is required to
    # run this repo's unit tests (fakeredis stands in — see dev deps below);
    # docker-compose's redis service is required for integration tests.
    "redis[asyncio]>=5.0",
    # Embedding provider (Part 7 item 6, now resolved): local
    # sentence-transformers (all-MiniLM-L6-v2, 384-dim) — no API key needed,
    # fully offline/reproducible. See src/embedding/sentence_transformer_provider.py
    # for why local over a hosted API, and src/resolution/scoring.py for the
    # real measured calibration this choice drove.
    "sentence-transformers>=3.0",
    # LLM vendor for the Increment 15 natural-language layer, narrative
    # summaries, and role classification. src/llm/chat.py imports it lazily and
    # only when LLM_PROVIDER=anthropic, so the entire test suite (which runs on
    # deterministic stub chat_fns) never touches it.
    "anthropic>=0.40",
    # Observability (docs/plan.md §14 -- Phase 0 of docs/evaluation.md's
    # implementation plan). prometheus-client serves GET /metrics directly
    # (api/main.py) with no collector service required. OTel gives request
    # spans (FastAPI auto-instrumentation) and manual Neo4j-call spans
    # (src/core/neo4j_client.py) -- an operator wires an OTLP exporter via
    # standard OTEL_* env vars; unconfigured, spans are created and dropped.
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # 1536-dim hosted embedding provider (Phase 7, docs/evaluation.md's B5
    # item) -- src/embedding/openai_embedding_provider.py. Imported lazily
    # there, same pattern as src/llm/chat.py's `anthropic` import, so the
    # test suite never needs this installed or a real key.
    "openai>=1.50",
    "httpx>=0.27",
    # Required by FastAPI's UploadFile/File dependency used for scanned buyer
    # workspace binary uploads. Text-only uploads remain JSON endpoints.
    "python-multipart>=0.0.9",
    # Kafka transport (Phase 8, feature-flagged, off by default -- see
    # src/ingestion/kafka_transport.py and docs/adr-0003-kafka-event-bus.md).
    "aiokafka>=0.11",
    # Qdrant secondary vector backend (Phase 8, feature-flagged, off by
    # default -- see src/embedding/qdrant_backend.py and
    # docs/adr-0004-qdrant-secondary-vector-store.md).
    "qdrant-client>=1.10",
    # OIDC/JWT SSO scaffolding (docs/evaluation.md's Showpad engineering-
    # rigor assessment, Band 2), feature-flagged off by default -- see
    # src/auth/sso.py.
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "fakeredis>=2.20",
    "pytest-cov>=6.0",
]
eval = [
    # Optional LLM-judge evaluation; normal API/test installs stay offline.
    "ragas>=0.2.14,<0.5",
    "langchain-openai>=0.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"  # matches requires-python above -- see its comment

[tool.ruff.lint]
# Was implicitly ruff's own default (E4/E7/E9/F only) with no [tool.ruff.lint]
# section at all -- verified drift (docs/evaluation.md's Showpad engineering-
# rigor assessment, 2026-08-08, Band 1). Broadened to add real signal this
# codebase didn't have: B (bugbear -- common correctness footguns, e.g.
# mutable default arguments, loop-variable closures), I (import sorting --
# consistency only, no correctness claim), S (bandit-derived security checks
# -- hardcoded-password/SQL-string-building/etc patterns).
select = ["E4", "E7", "E9", "F", "B", "I", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) fires on every pytest `assert` -- that's the whole idiom of
# the test suite, not a security-relevant assert-stripped-under-`-O` risk
# bandit's rule exists for. Standard practice (bandit's own docs recommend
# this exact exclusion for test suites). src/ and api/'s small number of
# real asserts (type-narrowing an invariant mypy can't see across a method
# or dataclass boundary) are each individually noqa'd with a reason instead
# -- an assert used for actual validation there should still be flagged.
# S105/S106: test fixtures assign literal strings to args/vars named
# password/secret (e.g. neo4j_password="test-value",
# panel_token_secret="unit-test-secret") -- bandit's heuristic matches the
# *name*, not an actual leaked credential; these are fake values that exist
# only to exercise config validation.
"tests/**/*.py" = ["S101", "S105", "S106"]
# S608: api/routes/viz_templates.py's _PAGE/_PANEL_PAGE/_BUYER_PORTAL_PAGE are
# large multi-line HTML/JS template string constants (the /viz debug UI, the
# embeddable panel, and the buyer portal), not SQL/Cypher query construction
# -- the rule's string-heuristic false-positives on some substring inside one
# of them. A trailing `# noqa` isn't usable here: the flagged line is the
# opening `"""` of a string that doesn't close until many lines later, so any
# comment placed after it becomes literal string content instead of an
# actual Python comment. Was api/routes/viz.py's own ignore before that
# file's static templates were split out into this dedicated module.
"api/routes/viz_templates.py" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection system requires calling Depends(...)/
# Query(...)/etc. as a parameter default -- that IS the framework's API,
# not the "mutable default argument" footgun B008 exists to catch (e.g.
# `def f(x=[])`). Every route in api/routes/*.py does this; without this,
# B008 would need a per-site noqa at dozens of call sites for a pattern
# that's correct by construction.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File"]

[tool.mypy]
# mypy was a declared dev dependency (line 70) with no config anywhere --
# verified drift (docs/evaluation.md's Showpad engineering-rigor
# assessment, 2026-08-08, Band 1): the codebase is thoroughly annotated
# (typed signatures, `from __future__ import annotations` throughout) but
# nothing was checking those annotations. This section is that check,
# scoped to src/ and api/ (the annotated application code) -- tests/ is
# intentionally excluded: test bodies lean on pytest fixtures and loose
# dict literals for readability, and gaining little from strict checking
# there wasn't worth the noise of a first pass.
python_version = "3.11"
files = ["src", "api"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Third-party libs without complete/any type stubs -- silences import-time
# noise, not a blanket escape hatch (nothing in src/ or api/ itself is
# exempted below).
[[tool.mypy.overrides]]
module = [
    "neo4j.*",
    "structlog.*",
    "rapidfuzz.*",
    "aiokafka.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "langgraph.*",
    # Optional `[eval]` extra (src/evaluation/ragas_runner.py). Ship no
    # py.typed marker, and are imported lazily inside a function guarded by
    # ImportError -- so they are absent entirely in a default install.
    "datasets.*",
    "ragas.*",
    "langchain_openai.*",
]
ignore_missing_imports = true
